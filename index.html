```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>I Love You ❤️</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        font-family: "Poppins", Arial, sans-serif;
        background: radial-gradient(
          circle at center,
          #3b1025 0%,
          #170812 45%,
          #080308 100%
        );
        color: white;
      }

      /* =========================
           BACKGROUND
        ========================= */

      .background {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .glow {
        position: absolute;
        width: 500px;
        height: 500px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #ff2f7d;
        opacity: 0.12;
        filter: blur(100px);
        border-radius: 50%;
        animation: glowPulse 3s ease-in-out infinite;
      }

      @keyframes glowPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(0.9);
          opacity: 0.08;
        }

        50% {
          transform: translate(-50%, -50%) scale(1.15);
          opacity: 0.18;
        }
      }

      /* =========================
           MAIN
        ========================= */

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 5;
      }

      .hint {
        position: absolute;
        top: 13%;
        font-size: 14px;
        letter-spacing: 3px;
        text-transform: uppercase;
        opacity: 0.65;
        animation: hintFloat 2s ease-in-out infinite;
      }

      @keyframes hintFloat {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-7px);
        }
      }

      /* =========================
           LOVE BUTTON
        ========================= */

      .heart-button {
        position: relative;
        width: 150px;
        height: 150px;
        border: none;
        background: transparent;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
        -webkit-tap-highlight-color: transparent;
      }

      .heart-button:hover {
        transform: scale(1.08);
      }

      .heart-button:active {
        transform: scale(0.9);
      }

      .heart {
        position: relative;
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #ff4f91, #e90055);
        transform: rotate(-45deg);
        border-radius: 12px;
        box-shadow:
          0 0 25px rgba(255, 48, 125, 0.7),
          0 0 60px rgba(255, 48, 125, 0.35);
        animation: heartbeat 1.2s infinite;
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: inherit;
      }

      .heart::before {
        top: -50px;
        left: 0;
      }

      .heart::after {
        top: 0;
        left: 50px;
      }

      @keyframes heartbeat {
        0%,
        100% {
          transform: rotate(-45deg) scale(1);
        }

        15% {
          transform: rotate(-45deg) scale(1.12);
        }

        30% {
          transform: rotate(-45deg) scale(1);
        }

        45% {
          transform: rotate(-45deg) scale(1.08);
        }

        60% {
          transform: rotate(-45deg) scale(1);
        }
      }

      /* =========================
           TEXT
        ========================= */

      .message {
        margin-top: 65px;
        text-align: center;
        opacity: 0;
        transform: translateY(20px) scale(0.8);
        pointer-events: none;
      }

      .message.show {
        animation: messageIn 1.2s cubic-bezier(0.17, 0.67, 0.32, 1.3) forwards;
      }

      .message h1 {
        font-size: clamp(30px, 7vw, 65px);
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #fff, #ff9fc5, #fff, #ff5e9a);
        background-size: 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: textShine 4s linear infinite;
      }

      .message p {
        margin-top: 12px;
        font-size: 15px;
        letter-spacing: 4px;
        opacity: 0.8;
      }

      @keyframes messageIn {
        0% {
          opacity: 0;
          transform: translateY(30px) scale(0.7);
        }

        60% {
          opacity: 1;
          transform: translateY(-8px) scale(1.05);
        }

        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes textShine {
        0% {
          background-position: 0%;
        }

        100% {
          background-position: 300%;
        }
      }

      /* =========================
           FLOATING HEARTS
        ========================= */

      .floating-heart {
        position: fixed;
        bottom: -40px;
        font-size: 20px;
        pointer-events: none;
        animation: floatUp linear forwards;
        z-index: 2;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) rotate(0deg) scale(0.7);
          opacity: 0;
        }

        10% {
          opacity: 1;
        }

        80% {
          opacity: 0.8;
        }

        100% {
          transform: translateY(-110vh) rotate(360deg) scale(1.4);
          opacity: 0;
        }
      }

      /* =========================
           HEART EXPLOSION
        ========================= */

      .burst-heart {
        position: fixed;
        left: 50%;
        top: 50%;
        pointer-events: none;
        font-size: 22px;
        z-index: 20;
        animation: burst 1.4s ease-out forwards;
      }

      @keyframes burst {
        0% {
          transform: translate(-50%, -50%) scale(0.2) rotate(0deg);
          opacity: 1;
        }

        100% {
          transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
            scale(1.4) rotate(var(--rotate));
          opacity: 0;
        }
      }

      /* =========================
           SPARKLES
        ========================= */

      .spark {
        position: fixed;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
        pointer-events: none;
        z-index: 15;
        animation: sparkle 1s ease-out forwards;
        box-shadow: 0 0 10px white;
      }

      @keyframes sparkle {
        0% {
          transform: scale(0);
          opacity: 1;
        }

        50% {
          transform: scale(1.5);
          opacity: 1;
        }

        100% {
          transform: translate(var(--x), var(--y)) scale(0);
          opacity: 0;
        }
      }

      /* =========================
           CLICK MESSAGE
        ========================= */

      .tap-again {
        position: fixed;
        bottom: 7%;
        font-size: 12px;
        letter-spacing: 2px;
        opacity: 0;
        transition: 1s;
      }

      .tap-again.show {
        opacity: 0.6;
      }

      /* =========================
           MUSIC BUTTON
        ========================= */

      .music-button {
        position: fixed;
        top: 25px;
        right: 25px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        cursor: pointer;
        backdrop-filter: blur(10px);
        opacity: 0;
        transition: 0.3s;
        z-index: 30;
      }

      .music-button.show {
        opacity: 1;
      }

      .music-button:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      /* =========================
           MOBILE
        ========================= */

      @media (max-width: 600px) {
        .hint {
          top: 10%;
          font-size: 11px;
          letter-spacing: 2px;
        }

        .heart-button {
          width: 125px;
          height: 125px;
        }

        .heart,
        .heart::before,
        .heart::after {
          width: 82px;
          height: 82px;
        }

        .heart::before {
          top: -41px;
        }

        .heart::after {
          left: 41px;
        }

        .message {
          margin-top: 50px;
          padding: 0 20px;
        }

        .message p {
          font-size: 11px;
          letter-spacing: 2px;
        }
      }
    </style>
  </head>

  <body>
    <!-- BACKGROUND -->
    <div class="background">
      <div class="glow"></div>
    </div>

    <!-- MUSIC -->
    <!-- Taruh file musik.mp3 di folder yang sama dengan index.html -->
    <audio id="music" loop>
      <source src="lagu.mp3" type="audio/mpeg" />
    </audio>

    <!-- MUSIC BUTTON -->
    <button class="music-button" id="musicButton">🎵</button>

    <!-- MAIN -->
    <main class="container">
      <div class="hint" id="hint">tap the heart</div>

      <button class="heart-button" id="heartButton">
        <div class="heart"></div>
      </button>

      <div class="message" id="message">
        <h1>I LOVE YOU SO MUCH ❤️</h1>

        <p>more than words can ever say</p>
      </div>
    </main>

    <div class="tap-again" id="tapAgain">tap again ❤️</div>

    <script>
      /* =========================
           ELEMENTS
        ========================= */

      const heartButton = document.getElementById("heartButton");
      const message = document.getElementById("message");
      const hint = document.getElementById("hint");
      const tapAgain = document.getElementById("tapAgain");

      const music = document.getElementById("music");
      const musicButton = document.getElementById("musicButton");

      let activated = false;

      /* =========================
           LOVE CLICK
        ========================= */

      heartButton.addEventListener("click", () => {
        activated = true;

        /* Hide hint */
        hint.style.opacity = "0";

        /* Show message */
        message.classList.add("show");

        /* Show music button */
        musicButton.classList.add("show");

        /* Show tap again */
        setTimeout(() => {
          tapAgain.classList.add("show");
        }, 1500);

        /* Play music */

        music.volume = 0.55;

        music.play().catch(() => {
          console.log("Music membutuhkan file musik.mp3");
        });

        /* Heart explosion */
        createHeartExplosion();

        /* Sparkles */
        createSparkles();

        /* Screen pulse */
        document.body.animate(
          [
            { transform: "scale(1)" },
            { transform: "scale(1.02)" },
            { transform: "scale(1)" },
          ],
          {
            duration: 500,
            easing: "ease-out",
          },
        );
      });

      /* =========================
           HEART EXPLOSION
        ========================= */

      function createHeartExplosion() {
        const hearts = ["❤️", "💗", "💖", "💕", "💓", "💘", "💝"];

        for (let i = 0; i < 45; i++) {
          const heart = document.createElement("div");

          heart.className = "burst-heart";

          heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

          const angle = Math.random() * Math.PI * 2;

          const distance = 120 + Math.random() * 400;

          const x = Math.cos(angle) * distance;

          const y = Math.sin(angle) * distance;

          const rotate = Math.random() * 720 - 360;

          heart.style.setProperty("--x", `${x}px`);

          heart.style.setProperty("--y", `${y}px`);

          heart.style.setProperty("--rotate", `${rotate}deg`);

          heart.style.animationDuration = `${0.9 + Math.random() * 0.8}s`;

          document.body.appendChild(heart);

          setTimeout(() => {
            heart.remove();
          }, 1800);
        }
      }

      /* =========================
           SPARKLES
        ========================= */

      function createSparkles() {
        for (let i = 0; i < 35; i++) {
          const spark = document.createElement("div");

          spark.className = "spark";

          const angle = Math.random() * Math.PI * 2;

          const distance = 100 + Math.random() * 450;

          const x = Math.cos(angle) * distance;

          const y = Math.sin(angle) * distance;

          spark.style.left = "50%";
          spark.style.top = "50%";

          spark.style.setProperty("--x", `${x}px`);

          spark.style.setProperty("--y", `${y}px`);

          spark.style.animationDelay = `${Math.random() * 0.3}s`;

          document.body.appendChild(spark);

          setTimeout(() => {
            spark.remove();
          }, 1500);
        }
      }

      /* =========================
           FLOATING HEARTS
        ========================= */

      function createFloatingHeart() {
        const heart = document.createElement("div");

        heart.className = "floating-heart";

        const hearts = ["❤️", "💕", "💗", "💖", "💓", "💘"];

        heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.fontSize = 12 + Math.random() * 25 + "px";

        heart.style.animationDuration = 5 + Math.random() * 7 + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 13000);
      }

      /* Generate hearts continuously */

      setInterval(() => {
        createFloatingHeart();
      }, 700);

      /* =========================
           MUSIC CONTROL
        ========================= */

      musicButton.addEventListener("click", () => {
        if (music.paused) {
          music.play();

          musicButton.textContent = "🎵";
        } else {
          music.pause();

          musicButton.textContent = "🔇";
        }
      });

      /* =========================
           EXTRA CLICK EFFECT
        ========================= */

      document.addEventListener("click", (event) => {
        if (!activated) return;

        for (let i = 0; i < 5; i++) {
          const spark = document.createElement("div");

          spark.className = "spark";

          spark.style.left = event.clientX + "px";

          spark.style.top = event.clientY + "px";

          const x = Math.random() * 100 - 50;

          const y = Math.random() * 100 - 50;

          spark.style.setProperty("--x", `${x}px`);

          spark.style.setProperty("--y", `${y}px`);

          document.body.appendChild(spark);

          setTimeout(() => {
            spark.remove();
          }, 1000);
        }
      });
    </script>
  </body>
</html>
```
